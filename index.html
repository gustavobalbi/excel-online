<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- ======== ESSENTIALS ======== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- ======== BRANDING & METADATA ======== -->
    <title>Excel Online — Editor de Planilhas</title>
    <meta name="description" content="Editor de planilhas online com suporte a importação/exportação de arquivos Excel, autenticação por código de conexão e publicação em tempo real." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="light" />
    <meta name="apple-mobile-web-app-title" content="Excel Online" />
    
    <!-- ======== PERFORMANCE HINTS ======== -->
    <!-- Favicon preload (SVG icon) -->
    <link rel="preload" href="/favicon.svg" as="image" type="image/svg+xml" />
    <!-- Prefetch system-ui font stack (already loaded by browser, but ensure priority) -->
    <link rel="prefetch" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    
    <!-- ======== FAVICON ======== -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- ======== RESET CSS & STRUCTURAL LAYOUT (NEUTRAL, NO DECORATION) ======== -->
    <style>
      /* CSS Reset — minimalista, apenas estrutura. Sem cores, backgrounds, borders decorativos. */
      
      /* Root reset */
      * {
        box-sizing: border-box;
      }
      
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      
      html {
        /* Enable smooth scrolling where supported */
        scroll-behavior: smooth;
      }
      
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #1a1a1a;
        background: #ffffff;
        /* Prevent font size adjustments on iOS during orientation changes */
        -webkit-text-size-adjust: 100%;
      }
      
      /* Main app layout — flex column for toolbar + editor */
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
        overflow: hidden;
      }
      
      /* Toolbar — horizontal flex row */
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        flex-wrap: wrap;
        flex-shrink: 0;
      }
      
      .toolbar .spacer {
        flex: 1;
      }
      
      /* Editor surface — flex grow to fill remaining vertical space */
      .editor-surface {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      
      /* Modal structure — fixed overlay */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      
      .modal {
        max-width: 90vw;
        overflow: auto;
      }
      
      /* Responsive breakpoints (documented for testing) */
      /* Mobile: < 640px */
      /* Tablet: 640px — 1024px */
      /* Desktop: > 1024px */
      @media (max-width: 640px) {
        .toolbar {
          gap: 4px;
          padding: 6px 8px;
        }
      }
    </style>
  </head>
  
  <body>
    <!-- ======== ROOT COMPONENT CONTAINER ======== -->
    <!-- React mounts here via src/main.tsx
         Expected structure:
         - <App> component
           - .app container
             - .toolbar (metadata, buttons, status, mock badge)
             - <Editor> component (Univer.js spreadsheet)
             - <input type="file"> (hidden, for import)
             - <SettingsModal> component (overlay for connection code config)
    -->
    <div id="root" role="application" aria-label="Excel Online Editor"></div>
    
    <!-- ======== ENTRY POINT ======== -->
    <!-- React application initialization (async ES module) -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- ======== PERFORMANCE TRACKING (Optional, for UX testing) ======== -->
    <!-- Uncomment below if tracking Web Vitals during UX/UI testing -->
    <!--

      // Web Vitals monitoring stub — customize as needed for test analysis

        window.addEventListener('web-vital', (e) => {
          console.debug('[Web Vital]', e.detail.name, e.detail.value);
        });
      }
    </script>
    -->
  </body>
</html>
